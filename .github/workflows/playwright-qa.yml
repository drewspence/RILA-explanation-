name: Playwright QA

on:
  pull_request:
    branches: ["**"]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run Playwright QA suite
        env:
          CI: "true"
          PLAYWRIGHT_LOCAL_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3000
        run: npm run qa:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Check for Playwright test-result artifacts
        if: always()
        id: test_results_check
        run: |
          RESULT_FILE_COUNT="$(find test-results/playwright -type f 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${RESULT_FILE_COUNT}" -gt 0 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright test results
        if: always() && steps.test_results_check.outputs.has_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright
          if-no-files-found: warn

      - name: Publish QA summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Playwright QA Results
          - Suite: npm run qa:e2e
          - Base URL: http://127.0.0.1:3000
          - Artifact always uploaded: playwright-report (HTML report).
          EOF

          if [ "${{ steps.test_results_check.outputs.has_results }}" = "true" ]; then
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          - Additional artifact uploaded: playwright-test-results (failure screenshots, traces, videos, and test attachments when present).
          EOF
          else
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          - No test-results artifacts were produced in this run (common on clean passes when no failure-only artifacts are generated).
          EOF
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          - Open Actions > this run > Artifacts to download and inspect outputs.
          - Any failing Playwright test fails this job automatically.
          EOF
