name: Playwright QA

on:
  pull_request:
    branches: ["**"]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run Playwright QA suite
        env:
          CI: "true"
          PLAYWRIGHT_LOCAL_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3000
        run: npm run qa:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright/**
          if-no-files-found: warn

      - name: Publish QA summary
        if: always()
        run: |
          {
            echo "## Playwright QA Results";
            echo "- Suite: \\`npm run qa:e2e\\`";
            echo "- Base URL: \\`http://127.0.0.1:3000\\`";
            echo "- Artifacts: \\`playwright-report\\` (HTML), \\`playwright-test-results\\` (screenshots/traces/videos/attachments).";
            echo "- Open **Actions > this run > Artifacts** to download and inspect failures.";
            echo "- Any failing test will fail this job automatically.";
          } >> "$GITHUB_STEP_SUMMARY"
